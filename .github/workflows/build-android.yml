name: Build Castex Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Castex Stable & Lite APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Castex Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Unlimited Maven Central Mirror (Fix HTTP 429 & Gradle 8)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirror.gradle.kts
          gradle.settingsEvaluated {
              pluginManagement {
                  repositories.withType(MavenArtifactRepository::class.java).configureEach {
                      if (url.toString().contains("repo.maven.apache.org")) {
                          setUrl("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
              dependencyResolutionManagement {
                  repositories.withType(MavenArtifactRepository::class.java).configureEach {
                      if (url.toString().contains("repo.maven.apache.org")) {
                          setUrl("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
          }

          gradle.allprojects {
              buildscript {
                  repositories.withType(MavenArtifactRepository::class.java).configureEach {
                      if (url.toString().contains("repo.maven.apache.org")) {
                          setUrl("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
              repositories.withType(MavenArtifactRepository::class.java).configureEach {
                  if (url.toString().contains("repo.maven.apache.org")) {
                      setUrl("https://maven-central.storage-download.googleapis.com/maven2/")
                  }
              }
          }
          EOF

          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.workers.max=2
          systemProp.http.keepAlive=true
          systemProp.http.maxConnections=4
          EOF

      - name: Repair Android Project & Keep Castex Code
        working-directory: app
        run: |
          mkdir -p /tmp/castex_backup
          cp -r lib /tmp/castex_backup/lib
          cp pubspec.yaml /tmp/castex_backup/pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --org com.castex.app --project-name castex
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          rm -rf lib
          cp -r /tmp/castex_backup/lib lib
          cp /tmp/castex_backup/pubspec.yaml pubspec.yaml

      - name: Install Flutter Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Castex Stable & Lite APKs
        working-directory: app
        run: |
          flutter build apk --release
          mkdir -p build/castex-apks
          cp build/app/outputs/flutter-apk/app-release.apk build/castex-apks/Castex-v1.0-Stable.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/castex-apks/Castex-v1.0-Lite.apk

      - name: Upload Castex APKs
        uses: actions/upload-artifact@v4
        with:
          name: Castex-v1.0-APKs
          path: app/build/castex-apks/*.apk
