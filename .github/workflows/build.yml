name: Build Castex APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Castex Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Project Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --org com.castex --project-name castex --platforms android .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Apply Custom Castex Launcher Icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - << 'EOF'
          import os, glob, shutil
          from PIL import Image, ImageDraw

          src = None
          for f in glob.glob("assets/*"):
              if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                  src = f
                  break

          if src:
              img = Image.open(src).convert("RGBA")
          else:
              img = Image.new("RGBA", (512, 512), (0, 0, 0, 255))
              d = ImageDraw.Draw(img)
              d.pieslice([86, 86, 426, 426], start=38, end=322, fill=(255, 255, 255, 255))
              d.ellipse([146, 146, 366, 366], fill=(0, 0, 0, 255))
              d.polygon([(235, 192), (235, 320), (355, 256)], fill=(229, 9, 20, 255))

          for anydpi in glob.glob("android/app/src/main/res/mipmap-anydpi*"):
              shutil.rmtree(anydpi, ignore_errors=True)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in sizes.items():
              out_dir = os.path.join("android/app/src/main/res", folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
              resized.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")
          EOF

      - name: Install Packages
        run: flutter pub get

      - name: Build Castex Stable & Lite APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Castex-Stable-v1.0.0.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Castex-Lite-v1.0.0.apk

      - name: Upload Castex APKs
        uses: actions/upload-artifact@v4
        with:
          name: Castex-v1.0.0-APKs
          path: |
            app/build/app/outputs/flutter-apk/Castex-Stable-v1.0.0.apk
            app/build/app/outputs/flutter-apk/Castex-Lite-v1.0.0.apk
