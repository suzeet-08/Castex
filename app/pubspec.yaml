name: castex
description: Castex - Free Open-Source Cross-Platform Media Streaming App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0'

dependencies:
  flutter:
    sdk: flutter
  http: 1.2.2
  shared_preferences: 2.2.3
  url_launcher: 6.3.0
  video_player: 2.8.6
  wakelock_plus: 1.1.6
  path_provider: 2.1.3
  share_plus: 7.2.2
  file_picker: 8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0

flutter:
  uses-material-design: true
