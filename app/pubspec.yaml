name: castex
description: Castex - Free Open-Source Cross-Platform Media Streaming App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  wakelock_plus: ^1.2.8
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
